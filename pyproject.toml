[project]
name = "pepkio-nih-modular-budget-builder"
version = "0.1.0"
description = "Python client for Pepkio NIH Modular Budget Builder tool"
readme = "README_PYPI.md"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
]

[project.scripts]
pepkio-nih-modular-budget-builder = "pepkio_nih_modular_budget_builder.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pepkio_nih_modular_budget_builder"]

[dependency-groups]
dev = [
    "hatchling>=1.25.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-httpx>=0.36.2",
    "python-dotenv>=1.0.0",
    "ruff>=0.3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
